server:
  port: 8085

spring:
  application:
    name: ai-agent

  kafka:
    bootstrap-servers: localhost:29092,localhost:29093,localhost:29094
    producer:
      properties:
        enable:
          idempotence: true
        acks: all
        batch.size: 1024
        linger.ms: 10000
        schema.registry.url: http://localhost:8087
    consumer:
      properties:
        enable.auto.commit: false
        isolation.level: read_committed
        fetch.min.bytes: 1024
        fetch.max.bytes: 1048576
        fetch.max.wait.ms: 100
        max.poll.interval.ms: 300000
        max.poll.records: 50
        schema.registry.url: http://localhost:8087
        session.timeout.ms: 15000
        heartbeat.interval.ms: 5000
      auto-offset-reset: earliest

app:

  prioritization:
    high-keywords:
      - critical
      - urgent
      - breaking
      - security
    low-keywords:
      - minor
      - typo
      - chore
      - docs
      -
  grouping:
    window-ms: 30000
    core-pool-size: 2

  filter:
    excluded-authors:
      - bot
    stop-words:
      - casino
      - spam
      - advertising
    min-text-length: 2
  summarization:
    max-length: 20

  kafka:
    topics:
      link-raw-updates:
        name: link-raw-updates
        attempts: 3
      link-processed-updates:
        name: link-processed-updates
        partitions: 3
        replicas: 3

logging:
  level:
    org.springframework.kafka: DEBUG
    org.springframework.kafka.listener: DEBUG
