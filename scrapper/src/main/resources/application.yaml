server:
  port: 8081

spring:
  application:
    name: scrapper
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:linktracker_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
  grpc:
    server:
      port: 9091


app:
  db:
    workers:
      link-update:
        batch-size: 12 # задаётся гибко по нагрузке, но расчитывается дефолту как scheduler.batch-size / scheduler.thread-pool-size
        flush-timeout: 200
        core-pool-size: 2
        max-pool-size: 4
        queue-capacity: 0
    access-type: orm
  scheduler:
    batch-size: 50
    interval-update-ms: 60000
  client:
    api-workers:
      thread-pool-size: 4 # пул потоков, занимющихся походом за API
      queue-capacity: 10
    stackoverflow:
      host: https://api.stackexchange.com/2.3
      key: ${STACKOVERFLOW_KEY} # Use env variable. DO NOT KEEP TOKEN HERE
      access-token: ${STACKOVERFLOW_ACCESS_TOKEN} # Use env variable. DO NOT KEEP TOKEN HERE
    github:
      host: https://api.github.com
      token: ${GITHUB_TOKEN} # Use env variable. DO NOT KEEP TOKEN HERE
    bot:
      host: ${APP_CLIENT_BOT_HOST:http://localhost:8080}
      grpc-host: ${APP_CLIENT_BOT_GRPC_HOST:localhost:9090}
      api:
        rest:
          enabled: true
        grpc:
          enabled: false
logging:
  level:
    org.hibernate.sql: DEBUG
